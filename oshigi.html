<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>推し木｜あなたにぴったりの吉野杉と出会う（サンプル）</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo" aria-label="推し木">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <ellipse cx="16" cy="21" rx="12" ry="8" fill="#9A6A45"/>
          <ellipse cx="16" cy="20" rx="9.5" ry="6" fill="#F6E1BE"/>
          <ellipse cx="16" cy="20" rx="5.5" ry="3.4" fill="none" stroke="#C98D63" stroke-width="1.2"/>
          <path d="M16 13V7" stroke="#4E9A63" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="12" cy="7" rx="4" ry="2.4" fill="#6DBE7F" transform="rotate(-25 12 7)"/>
          <ellipse cx="20" cy="6" rx="4" ry="2.4" fill="#6DBE7F" transform="rotate(25 20 6)"/>
        </svg>
        推し木
      </div>
      <div class="top-meta" id="topMeta">吉野杉マッチング</div>
    </header>

    <!-- 各画面は js/screens/*.js がここに描画する -->
    <main id="main"></main>

    <nav class="tabs" id="tabs" hidden aria-label="メニュー">
      <button class="tab" data-tab="swipe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="5" y="3" width="14" height="18" rx="4"/>
          <path d="M9 13.5c1 1.5 5 1.5 6 0"/>
          <circle cx="9.5" cy="10" r=".6" fill="currentColor"/>
          <circle cx="14.5" cy="10" r=".6" fill="currentColor"/>
        </svg>
        さがす
      </button>
      <button class="tab" data-tab="oshi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M12 20s-7-4.3-8.9-8.6C1.7 8.1 3.7 4.8 7 4.8c2 0 3.3 1.1 5 3 1.7-1.9 3-3 5-3 3.3 0 5.3 3.3 3.9 6.6C19 15.7 12 20 12 20z"/>
        </svg>
        推し木
        <span class="count" id="oshiCount" hidden></span>
      </button>
      <button class="tab" data-tab="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <ellipse cx="12" cy="15" rx="8" ry="5.5"/>
          <ellipse cx="12" cy="15" rx="3.5" ry="2.2"/>
          <path d="M12 9.5V5M12 6c-1.5-2-4-2-4-2s.5 2.5 4 2zM12 6c1.5-2 4-2 4-2s-.5 2.5-4 2z"/>
        </svg>
        わたしの好み
      </button>
    </nav>
  </div>

  <!-- モーダル類 -->
  <div class="overlay" id="overlay" hidden></div>
  <div class="match" id="match" hidden role="dialog" aria-modal="true" aria-labelledby="matchTitle"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 読み込み順に依存しているので順番を変えないこと -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/svg.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/screens/start.js"></script>
  <script src="js/screens/quiz.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/swipe.js"></script>
  <script src="js/screens/match.js"></script>
  <script src="js/screens/sheet.js"></script>
  <script src="js/screens/oshi.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
